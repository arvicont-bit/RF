{% extends "base.html" %}
{% block title %}Cont nou{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-12 bg-white rounded-xl shadow-sm border border-slate-200 p-8">
  <h1 class="text-xl font-semibold mb-1">Creeaza cont</h1>
  <p class="text-sm text-slate-500 mb-6">Contul de administrare gestioneaza toate firmele client.</p>
  <form method="post" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">Numele firmei tale (tenant)</label>
      <input name="firm_name" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="ex. Cabinet Contabilitate Mav">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Email</label>
      <input name="email" type="email" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Parola</label>
      <input name="password" type="password" required minlength="6" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
    </div>
    <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white rounded-md py-2 text-sm font-medium transition">Creeaza cont</button>
  </form>
  <p class="text-sm text-slate-500 mt-4 text-center">Ai deja cont? <a href="{{ url_for('login') }}" class="text-brand-600 font-medium">Autentifica-te</a></p>
</div>
{% endblock %}
